<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Control Center - iConsult</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-midnight">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-content">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <a href="index.html" class="brand-logo">
          iConsult <span class="dot"></span>
        </a>
        <span id="user-handle-display" class="hero-badge" style="margin: 0; padding: 0.25rem 0.75rem;">@username</span>
      </div>

      <div class="nav-actions">
        <a id="btn-view-public" href="#" target="_blank" class="btn btn-secondary btn-sm">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> View My Page
        </a>
        <button id="btn-copy-public-link" class="btn btn-secondary btn-sm">
          <i class="fa-solid fa-copy"></i> Copy Link
        </button>
        <button id="btn-logout" class="btn btn-danger btn-sm">
          <i class="fa-solid fa-power-off"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Dashboard Main Grid -->
  <main class="container">
    <div class="dashboard-grid">

      <!-- Left Column: Editors -->
      <div>
        <!-- Profile & Bio Settings Card -->
        <div class="dashboard-card">
          <div class="card-header">
            <h2 class="heading-md"><i class="fa-solid fa-user-gear" style="color: var(--accent-glow);"></i> Profile & Bio Settings</h2>
            <button type="submit" form="form-profile" class="btn btn-primary btn-sm">
              <i class="fa-solid fa-floppy-disk"></i> Save Profile
            </button>
          </div>

          <form id="form-profile">
            <!-- Profile Image Picker Section -->
            <div class="form-group" style="text-align: center; margin-bottom: 1.5rem;">
              <label class="form-label" style="margin-bottom: 0.5rem; display: block;">Profile Picture</label>
              
              <div id="avatar-picker-trigger" style="position: relative; display: inline-block; cursor: pointer;" title="Click to upload new image">
                <img id="dashboard-avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=user" alt="Avatar Preview" style="width: 105px; height: 105px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-glow); box-shadow: 0 4px 15px rgba(0,0,0,0.3);" />
                <div style="position: absolute; bottom: 4px; right: 4px; background: var(--accent-glow); color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.4);">
                  <i class="fa-solid fa-camera" style="font-size: 0.85rem;"></i>
                </div>
              </div>
              <input type="file" id="input-avatar-file" accept="image/*" style="display: none;" />

              <div style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.85rem; flex-wrap: wrap;">
                <button type="button" id="btn-upload-avatar" class="btn btn-secondary btn-sm">
                  <i class="fa-solid fa-upload"></i> Upload Image
                </button>
                <button type="button" id="btn-gen-avatar" class="btn btn-secondary btn-sm">
                  <i class="fa-solid fa-dice"></i> Random Avatar
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="input-avatar-url">Image URL or Base64 Data</label>
              <input type="text" id="input-avatar-url" class="form-input" placeholder="https://example.com/avatar.jpg" />
            </div>

            <div class="form-group">
              <label class="form-label" for="input-display-name">Display Name</label>
              <input type="text" id="input-display-name" class="form-input" placeholder="e.g. Dr. Sarah Jenkins" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="input-tagline">Short Tagline / Role</label>
              <input type="text" id="input-tagline" class="form-input" placeholder="e.g. Clinical Psychologist & Author" />
            </div>

            <div class="form-group">
              <label class="form-label" for="input-bio">About Me (Bio)</label>
              <textarea id="input-bio" class="form-textarea" placeholder="Tell your audience about your practice, skills, services, or research..."></textarea>
            </div>

            <!-- Profession & General Themes Selector -->
            <div class="form-group">
              <label class="form-label" style="margin-bottom: 0.5rem; display: block;">Page Theme Preset</label>
              
              <p class="form-label" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem;">PROFESSION THEMES</p>
              <div class="preset-themes-grid" style="margin-bottom: 1rem;">
                <div class="theme-option" data-theme="doctor" style="background: #071927; color: #38bdf8;">
                  <i class="fa-solid fa-user-doctor"></i> Doctor / Medical
                </div>
                <div class="theme-option" data-theme="engineer" style="background: #0a0f1d; color: #f59e0b;">
                  <i class="fa-solid fa-laptop-code"></i> Engineer / Tech
                </div>
                <div class="theme-option" data-theme="psychologist" style="background: #140d21; color: #c084fc;">
                  <i class="fa-solid fa-brain"></i> Psychologist
                </div>
                <div class="theme-option" data-theme="lawyer" style="background: #0b132b; color: #f59e0b;">
                  <i class="fa-solid fa-scale-balanced"></i> Lawyer / Legal
                </div>
                <div class="theme-option" data-theme="artist" style="background: #18091e; color: #ec4899;">
                  <i class="fa-solid fa-palette"></i> Artist / Creative
                </div>
                <div class="theme-option" data-theme="finance" style="background: #041d14; color: #10b981;">
                  <i class="fa-solid fa-chart-line"></i> Finance / Biz
                </div>
              </div>

              <p class="form-label" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem;">GENERAL THEMES</p>
              <div class="preset-themes-grid">
                <div class="theme-option selected" data-theme="midnight" style="background: #090d16; color: white;">
                  <i class="fa-solid fa-moon"></i> Midnight
                </div>
                <div class="theme-option" data-theme="sunset" style="background: #2d122d; color: #f43f5e;">
                  <i class="fa-solid fa-sun"></i> Sunset
                </div>
                <div class="theme-option" data-theme="neon" style="background: #05050a; color: #38bdf8;">
                  <i class="fa-solid fa-bolt"></i> Neon
                </div>
                <div class="theme-option" data-theme="forest" style="background: #0b291d; color: #34d399;">
                  <i class="fa-solid fa-tree"></i> Forest
                </div>
                <div class="theme-option" data-theme="minimal" style="background: #f8fafc; color: #0f172a;">
                  <i class="fa-solid fa-feather"></i> Minimal
                </div>
              </div>
            </div>
          </form>
        </div>

        <!-- Links Manager Card -->
        <div class="dashboard-card">
          <div class="card-header">
            <h2 class="heading-md"><i class="fa-solid fa-link" style="color: var(--accent-glow);"></i> Manage Links</h2>
            <button id="btn-add-link" class="btn btn-primary btn-sm">
              <i class="fa-solid fa-plus"></i> Add New Link
            </button>
          </div>

          <div id="managed-links-container">
            <div style="text-align: center; padding: 2rem;">
              <div class="loading-spinner" style="margin: 0 auto 0.5rem;"></div>
              <p class="text-secondary">Loading links...</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Live Phone Frame Preview -->
      <div>
        <div class="mockup-sticky">
          <div style="text-align: center; margin-bottom: 0.75rem; font-weight: 600; color: var(--text-secondary);">
            <i class="fa-solid fa-mobile-screen"></i> Live Mobile Preview
          </div>

          <div class="phone-frame">
            <div class="phone-notch"></div>
            <div id="phone-screen-content" class="phone-screen theme-midnight">
              <!-- Dynamically rendered live view -->
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
